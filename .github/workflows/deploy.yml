name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

env:
  REGISTRY: europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo
  IMAGE: bitkit-watch
  REGION: europe-west6
  SERVICE: bitkit-watch

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      # PR checks remain useful after the demo ages. Deployments require a fresh snapshot.
      - if: github.event_name == 'pull_request'
        run: npm run verify -- --allow-stale-snapshot
      - if: github.event_name != 'pull_request'
        run: npm run verify
      - run: npm run test:browser

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.REGISTRY }}
          gcp_service_account_key: ${{ secrets.GRC_INFRA_READ_WRITE }}

      - uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE }}
          context: .
          cache_from: type=gha
          cache_to: type=gha,mode=max

      # Reachable only through the GCP load balancer.
      # allow-unauthenticated is required for the serverless NEG backend to
      # reach the service; ingress restricts who can send traffic to it.
      - uses: pubky/ci-workflows/.github/actions/cloudrun/deploy@main
        with:
          gcp_service_account_key: ${{ secrets.CLOUDRUN_INFRA }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --port=3000
            --ingress=internal-and-cloud-load-balancing
            --allow-unauthenticated
            --max-instances=3
