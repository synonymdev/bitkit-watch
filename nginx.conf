# Production response headers from docs/deployment.md.
# nginx only inherits add_header into a location that defines none itself, so
# the security headers live in an include that every location pulls in.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /app;
    index index.html;

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
